    <style>
        /* আপনার পুরনো ক্যালকুলেটরের ডিজাইন */
        body { display: flex; flex-direction: column; justify-content: flex-end; height: 100vh; margin: 0; background-color: #fff; font-family: sans-serif; }
        #result { font-size: 50px; text-align: right; padding: 20px; color: #202124; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px; }
        button { height: 70px; font-size: 25px; border: none; border-radius: 35px; background: #f8f9fa; color: #d93025; }
        .equal { background: #d93025; color: white; }
    </style>
</head>
<body>
    <div id="result">0</div>
    <div class="buttons">
        <button onclick="clearScreen()">C</button>
        <button onclick="appendValue('%')">%</button>
        <button onclick="backspace()">DEL</button>
        <button onclick="appendValue('/')">÷</button>
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('*')">×</button>
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="appendValue('-')">-</button>
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="appendValue('+')">+</button>
        <button onclick="appendValue('00')">00</button>
        <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
    <script>
        let res = document.getElementById('result');
        function appendValue(v) { res.innerText = (res.innerText === '0') ? v : res.innerText + v; }
        function clearScreen() { res.innerText = '0'; }
        function backspace() { res.innerText = (res.innerText.length > 1) ? res.innerText.slice(0, -1) : '0'; }
        function calculate() { try { res.innerText = eval(res.innerText.replace('×', '*').replace('÷', '/')); } catch { res.innerText = 'Error'; } }
    </script>
</body>
</html>
